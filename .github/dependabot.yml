version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: monthly
      time: "20:00"
  - package-ecosystem: "docker"
    directory: "/"
    # sync-go-version.yml adds matching go.mod changes to golang image PRs.
    schedule:
      interval: monthly
      time: "20:00"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
      time: "20:00"
